query GetUserProfile($id: String!) @auth(level: PUBLIC) {
  user(id: $id) {
    id
    fullName
    studentId
    facultyReference
    preferredRole
    gender
    reviews_on_targetUser {
      id
      rating
      comment
      reviewer {
        fullName
      }
    }
  }
}

